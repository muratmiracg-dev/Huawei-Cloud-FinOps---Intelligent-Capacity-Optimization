name: Defect
description: Report an analytics, API, deployment, or documentation defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cost ingestion
        - Allocation
        - Forecasting
        - Optimization
        - API
        - Infrastructure
        - Documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Remove credentials, account IDs, and customer billing data.
    validations:
      required: true
