name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test with coverage
        run: pytest --cov=finops --cov-report=term-missing --cov-report=xml
      - name: Verify repository contracts
        run: python scripts/verify_repository.py
      - name: Verify deterministic demo data
        run: |
          python scripts/generate_demo_data.py
          git diff --exit-code -- data/demo
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without backend
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Validate
        working-directory: infra/terraform
        run: terraform validate

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build
        run: docker build --tag huawei-finops:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run --detach --name finops -p 8080:8080 huawei-finops:${{ github.sha }}
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 2
          done
          docker logs finops
          exit 1
