name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4.37.7
        with:
          category: /language:python
