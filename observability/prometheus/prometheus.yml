global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: huawei-cloud-finops
    environment: local

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: finops-optimizer
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
        labels:
          service: finops-optimizer
          owner: platform-team
