<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Huawei Cloud FinOps control tower dashboard</title>
  <desc id="desc">A dark executive dashboard showing monthly cost, savings, allocation, maturity, service cost mix, recommendation queue, and forecast.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111d30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7000b"/>
      <stop offset="1" stop-color="#ff5964"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <style>
      .eyebrow { font: 700 14px Inter,Segoe UI,sans-serif; letter-spacing: 2.4px; fill: #ff7178; }
      .title { font: 800 38px Inter,Segoe UI,sans-serif; fill: #f8fafc; }
      .sub { font: 400 16px Inter,Segoe UI,sans-serif; fill: #94a3b8; }
      .cardLabel { font: 700 13px Inter,Segoe UI,sans-serif; fill: #91a2bb; letter-spacing: 1.2px; }
      .metric { font: 800 32px Inter,Segoe UI,sans-serif; fill: #f8fafc; }
      .good { font: 700 14px Inter,Segoe UI,sans-serif; fill: #5eead4; }
      .warn { font: 700 14px Inter,Segoe UI,sans-serif; fill: #fb923c; }
      .panelTitle { font: 700 18px Inter,Segoe UI,sans-serif; fill: #e8eef7; }
      .axis { font: 500 12px Inter,Segoe UI,sans-serif; fill: #71829c; }
      .row { font: 600 14px Inter,Segoe UI,sans-serif; fill: #c7d2e3; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="18" height="900" fill="url(#accent)"/>

  <text x="68" y="62" class="eyebrow">EXECUTIVE CONTROL TOWER · REPRODUCIBLE DEMO</text>
  <text x="68" y="108" class="title">Huawei Cloud FinOps &amp; Capacity Optimization</text>
  <text x="68" y="138" class="sub">June 2026 · USD · amortized cost · evidence-based recommendations</text>
  <rect x="1292" y="54" width="240" height="50" rx="25" fill="#122238" stroke="#2b3b55"/>
  <circle cx="1326" cy="79" r="7" fill="#34d399"/>
  <text x="1346" y="85" class="row">Data pipeline healthy</text>

  <g filter="url(#shadow)">
    <rect x="68" y="182" width="350" height="138" rx="20" fill="#101d30" stroke="#26364f"/>
    <rect x="438" y="182" width="350" height="138" rx="20" fill="#101d30" stroke="#26364f"/>
    <rect x="808" y="182" width="350" height="138" rx="20" fill="#101d30" stroke="#26364f"/>
    <rect x="1178" y="182" width="354" height="138" rx="20" fill="#101d30" stroke="#26364f"/>
  </g>
  <rect x="68" y="182" width="350" height="5" rx="3" fill="#c7000b"/>
  <rect x="438" y="182" width="350" height="5" rx="3" fill="#2dd4bf"/>
  <rect x="808" y="182" width="350" height="5" rx="3" fill="#38bdf8"/>
  <rect x="1178" y="182" width="354" height="5" rx="3" fill="#a78bfa"/>

  <text x="94" y="222" class="cardLabel">MONTHLY CLOUD COST</text>
  <text x="94" y="269" class="metric">$6,133.36</text>
  <text x="94" y="298" class="warn">+1.8% monthly baseline trend</text>

  <text x="464" y="222" class="cardLabel">MONTHLY SAVINGS</text>
  <text x="464" y="269" class="metric">$1,520.70</text>
  <text x="464" y="298" class="good">24.79% conservative opportunity</text>

  <text x="834" y="222" class="cardLabel">ALLOCATION COVERAGE</text>
  <text x="834" y="269" class="metric">97.43%</text>
  <text x="834" y="298" class="good">Above 95% governance target</text>

  <text x="1204" y="222" class="cardLabel">FINOPS MATURITY</text>
  <text x="1204" y="269" class="metric">96.4 / 100</text>
  <text x="1204" y="298" class="good">Visibility + governance + automation</text>

  <g filter="url(#shadow)">
    <rect x="68" y="344" width="930" height="296" rx="20" fill="#101d30" stroke="#26364f"/>
    <rect x="1018" y="344" width="514" height="296" rx="20" fill="#101d30" stroke="#26364f"/>
    <rect x="68" y="660" width="712" height="184" rx="20" fill="#101d30" stroke="#26364f"/>
    <rect x="800" y="660" width="732" height="184" rx="20" fill="#101d30" stroke="#26364f"/>
  </g>

  <text x="96" y="382" class="panelTitle">Monthly cost trend and 90% forecast band</text>
  <line x1="110" y1="574" x2="950" y2="574" stroke="#2a3a53"/>
  <line x1="110" y1="520" x2="950" y2="520" stroke="#213149"/>
  <line x1="110" y1="466" x2="950" y2="466" stroke="#213149"/>
  <line x1="110" y1="412" x2="950" y2="412" stroke="#213149"/>
  <text x="76" y="578" class="axis">$5.2K</text>
  <text x="76" y="524" class="axis">$5.6K</text>
  <text x="76" y="470" class="axis">$6.0K</text>
  <text x="76" y="416" class="axis">$6.4K</text>
  <path d="M118 556 C205 548 250 533 330 523 S465 500 535 487 S672 470 744 449 S865 432 942 418 L942 478 C860 489 790 498 744 506 S610 526 535 538 S410 552 330 560 S205 574 118 580 Z" fill="#2dd4bf" opacity=".12"/>
  <polyline points="118,556 262,538 406,516 550,493 694,471 838,447 942,431" fill="none" stroke="#ff5964" stroke-width="4"/>
  <polyline points="838,447 890,434 942,419" fill="none" stroke="#5eead4" stroke-width="4" stroke-dasharray="9 7"/>
  <circle cx="118" cy="556" r="5" fill="#ff5964"/>
  <circle cx="262" cy="538" r="5" fill="#ff5964"/>
  <circle cx="406" cy="516" r="5" fill="#ff5964"/>
  <circle cx="550" cy="493" r="5" fill="#ff5964"/>
  <circle cx="694" cy="471" r="5" fill="#ff5964"/>
  <circle cx="838" cy="447" r="6" fill="#ff5964"/>
  <text x="110" y="606" class="axis">JAN</text>
  <text x="252" y="606" class="axis">FEB</text>
  <text x="396" y="606" class="axis">MAR</text>
  <text x="540" y="606" class="axis">APR</text>
  <text x="684" y="606" class="axis">MAY</text>
  <text x="828" y="606" class="axis">JUN</text>
  <text x="921" y="606" class="axis">JUL</text>

  <text x="1046" y="382" class="panelTitle">Prioritized decision queue</text>
  <text x="1046" y="420" class="row">Rightsize compute</text>
  <rect x="1238" y="402" width="218" height="22" rx="11" fill="#25354e"/>
  <rect x="1238" y="402" width="172" height="22" rx="11" fill="#c7000b"/>
  <text x="1470" y="419" class="axis">7</text>
  <text x="1046" y="466" class="row">Schedule non-prod</text>
  <rect x="1238" y="448" width="218" height="22" rx="11" fill="#25354e"/>
  <rect x="1238" y="448" width="123" height="22" rx="11" fill="#fb923c"/>
  <text x="1470" y="465" class="axis">5</text>
  <text x="1046" y="512" class="row">Idle / release</text>
  <rect x="1238" y="494" width="218" height="22" rx="11" fill="#25354e"/>
  <rect x="1238" y="494" width="98" height="22" rx="11" fill="#38bdf8"/>
  <text x="1470" y="511" class="axis">4</text>
  <text x="1046" y="558" class="row">Request tuning</text>
  <rect x="1238" y="540" width="218" height="22" rx="11" fill="#25354e"/>
  <rect x="1238" y="540" width="74" height="22" rx="11" fill="#a78bfa"/>
  <text x="1470" y="557" class="axis">3</text>
  <text x="1046" y="604" class="row">Lifecycle / commitment</text>
  <rect x="1238" y="586" width="218" height="22" rx="11" fill="#25354e"/>
  <rect x="1238" y="586" width="49" height="22" rx="11" fill="#2dd4bf"/>
  <text x="1470" y="603" class="axis">2</text>

  <text x="96" y="700" class="panelTitle">Cost by Huawei Cloud service</text>
  <rect x="98" y="730" width="344" height="24" rx="12" fill="#c7000b"/>
  <rect x="442" y="730" width="154" height="24" rx="12" fill="#ff7b82"/>
  <rect x="596" y="730" width="90" height="24" rx="12" fill="#2dd4bf"/>
  <rect x="686" y="730" width="48" height="24" rx="12" fill="#38bdf8"/>
  <circle cx="104" cy="793" r="6" fill="#c7000b"/>
  <text x="119" y="798" class="row">CCE 32%</text>
  <circle cx="258" cy="793" r="6" fill="#ff7b82"/>
  <text x="273" y="798" class="row">ECS 29%</text>
  <circle cx="412" cy="793" r="6" fill="#2dd4bf"/>
  <text x="427" y="798" class="row">RDS 20%</text>
  <circle cx="566" cy="793" r="6" fill="#38bdf8"/>
  <text x="581" y="798" class="row">Other 19%</text>

  <text x="828" y="700" class="panelTitle">Governance and risk</text>
  <rect x="828" y="728" width="300" height="86" rx="15" fill="#13243a"/>
  <rect x="1148" y="728" width="168" height="86" rx="15" fill="#13243a"/>
  <rect x="1336" y="728" width="168" height="86" rx="15" fill="#13243a"/>
  <text x="852" y="754" class="cardLabel">BUDGET COVERAGE</text>
  <text x="852" y="794" class="metric">100%</text>
  <text x="1170" y="754" class="cardLabel">ANOMALIES</text>
  <text x="1170" y="794" class="metric">2</text>
  <text x="1358" y="754" class="cardLabel">HIGH RISK</text>
  <text x="1358" y="794" class="metric">1</text>
</svg>
