apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-daily-analysis
  namespace: finops-system
spec:
  schedule: "15 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: finops-daily-analysis
            finops.huaweicloud.com/cost-center: CC-300
            finops.huaweicloud.com/owner: platform-team
            finops.huaweicloud.com/environment: production
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: analysis
              image: ghcr.io/muratmiracg-dev/huawei-finops-optimizer:1.0.0
              command:
                - finops
                - --data-dir
                - /app/data/demo
                - summary
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
