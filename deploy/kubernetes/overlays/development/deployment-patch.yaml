apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-optimizer
  namespace: finops-system
spec:
  replicas: 1
  template:
    metadata:
      labels:
        finops.huaweicloud.com/environment: development
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
