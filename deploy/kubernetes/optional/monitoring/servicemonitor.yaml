apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finops-optimizer
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [finops-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: finops-optimizer
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
