replicaCount: 2

image:
  repository: ghcr.io/muratmiracg-dev/huawei-finops-optimizer
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8080"

finopsLabels:
  costCenter: CC-300
  owner: platform-team
  environment: production

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  APP_ENV: production
  LOG_LEVEL: INFO
  FINOPS_DATA_DIR: /app/data/demo
  DEFAULT_CURRENCY: USD
  FORECAST_MONTHS: "3"
  MINIMUM_SAVINGS_USD: "5"
  CAPACITY_HEADROOM_PCT: "25"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
