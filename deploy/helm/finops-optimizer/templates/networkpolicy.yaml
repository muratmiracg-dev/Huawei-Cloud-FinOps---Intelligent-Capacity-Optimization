{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finops-optimizer.fullname" . }}
  labels:
    {{- include "finops-optimizer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finops-optimizer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
{{- end }}
